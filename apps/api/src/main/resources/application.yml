spring:
  application:
    name: hack-plantilla-api

  datasource:
    # En producción lo inyecta docker-compose. Los defaults son para correr local.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hack}
    username: ${POSTGRES_USER:hack}
    password: ${POSTGRES_PASSWORD:hack}

  jpa:
    hibernate:
      # El esquema lo maneja Flyway, no Hibernate. `validate` avisa si el código
      # y las migraciones se desincronizan, en vez de mutar la tabla por su cuenta.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true    # corre src/main/resources/db/migration al arrancar

server:
  port: 8080

app:
  # Orígenes que pueden llamar a la API desde el browser. Coma como separador.
  # El default cubre el `index.html` abierto local y los dev servers típicos.
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5500}

springdoc:
  swagger-ui:
    path: /swagger-ui.html    # la UI
  api-docs:
    path: /v3/api-docs        # el JSON de OpenAPI

management:
  endpoints:
    web:
      # Deja el health en /health y no en /actuator/health: es la convención
      # del server (healthcheck de Docker y de Traefik apuntan ahí).
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
