<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hack-plantilla</title>
<style>
  :root {
    --bg: #fbfbfd; --card: #fff; --text: #16181d; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-text: #fff; --error: #b91c1c;
    --ok: #15803d; --ok-bg: #f0fdf4;
    /* Escala de radios: contenedor y control. Dos pasos, nada más. */
    --r-card: 12px; --r-control: 8px;
    /* Escala tipográfica: 28 / 16 / 13. Ratios 1.75 y 1.23. */
    --t-title: 1.75rem; --t-small: 0.8125rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f14; --card: #161920; --text: #e8eaed; --muted: #9aa1ac;
      --line: #262a33; --accent: #5b8cff; --accent-text: #0d0f14; --error: #f87171;
      --ok: #4ade80; --ok-bg: #0f2417;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.5rem 1.25rem; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: var(--t-title); margin: 0 0 .25rem; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: var(--t-small); margin: 0 0 2rem; }
  .sub code { word-break: break-all; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-card); padding: 1.25rem;
  }
  form { display: flex; gap: .5rem; margin-bottom: 1.25rem; }
  input {
    flex: 1; min-width: 0; padding: .625rem .75rem; font: inherit;
    color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: .625rem 1.1rem; font: inherit; font-weight: 550; cursor: pointer;
    color: var(--accent-text); background: var(--accent);
    border: 0; border-radius: 8px;
  }
  button:disabled { opacity: .5; cursor: default; }
  /* Ícono de verificado: escudo + check. Neutro hasta que el back responde. */
  .badge {
    display: inline-flex; align-items: center; gap: .4rem;
    margin-bottom: 1rem; padding: .35rem .7rem;
    font-size: var(--t-small); font-weight: 550;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 999px;
  }
  .badge svg { width: 1rem; height: 1rem; flex: none; }
  .badge.ok    { color: var(--ok); background: var(--ok-bg); border-color: currentColor; }
  .badge.bad   { color: var(--error); border-color: currentColor; }
  .badge.check { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .badge.check { animation: none; } }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 1rem; padding: .7rem 0; border-top: 1px solid var(--line);
    flex-wrap: wrap;
  }
  li:first-child { border-top: 0; }
  /* Chip del bloque: el ícono + el hash cortito. Click -> contrato. */
  .block {
    flex-basis: 100%; display: inline-flex; align-items: center; gap: .4rem;
    margin-top: .15rem; padding: .15rem 0;
    color: var(--muted); background: none; border: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .75rem;
  }
  .block svg { width: 1.05rem; height: 1.05rem; flex: none; color: var(--accent); }
  .block:hover, .block:focus-visible { color: var(--text); }

  dialog {
    width: min(30rem, calc(100vw - 2rem)); padding: 1.25rem;
    color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: var(--r-card);
  }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog h2 {
    display: flex; align-items: center; gap: .5rem;
    margin: 0 0 1rem; font-size: 1.125rem; letter-spacing: -.01em;
  }
  dialog h2 svg { width: 1.25rem; height: 1.25rem; color: var(--accent); }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .55rem .9rem; }
  dt { color: var(--muted); font-size: var(--t-small); }
  dd {
    margin: 0; font-size: var(--t-small); overflow-wrap: anywhere;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  dd.ok { color: var(--ok); } dd.bad { color: var(--error); }
  dialog form[method=dialog] { display: block; margin: 1.25rem 0 0; }
  dialog form[method=dialog] button { width: 100%; }

  time { color: var(--muted); font-size: .8125rem; font-variant-numeric: tabular-nums; }
  .msg { color: var(--muted); font-size: .875rem; padding: .7rem 0; }
  .msg.error { color: var(--error); }
</style>
</head>
<body>
<!-- Ícono del bloque (lucide `boxes`, ISC). Definido una vez, usado N veces
     con <use>. La fuente sin tocar está en blockchain.svg. -->
<svg hidden xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-block" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"/>
    <path d="m7 16.5-4.74-2.85"/><path d="m7 16.5 5-3"/><path d="M7 16.5v5.17"/>
    <path d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"/>
    <path d="m17 16.5-5-3"/><path d="m17 16.5 4.74-2.85"/><path d="M17 16.5v5.17"/>
    <path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"/>
    <path d="M12 8 7.26 5.15"/><path d="m12 8 4.74-2.85"/><path d="M12 13.5V8"/>
  </symbol>
</svg>

<main>
  <h1>hack-plantilla</h1>
  <p class="sub">Front mínimo consumiendo <code id="api-url"></code></p>

  <div class="card">
    <form id="form">
      <input id="name" placeholder="Nombre del item" required maxlength="120" autocomplete="off">
      <button type="submit">Agregar</button>
    </form>
    <button class="badge" id="verify" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2 4 5.5v6c0 4.6 3.2 8.8 8 10.5 4.8-1.7 8-5.9 8-10.5v-6L12 2Z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
      <span id="verify-text">Verificar cadena</span>
    </button>
    <ul id="list"></ul>
    <p class="msg" id="msg">Cargando…</p>
  </div>
</main>

<!-- El "contrato" del bloque: qué se firmó y con qué quedó encadenado. -->
<dialog id="contract">
  <h2><svg><use href="#i-block"/></svg><span id="c-title">Bloque</span></h2>
  <dl>
    <dt>Contenido</dt><dd id="c-name"></dd>
    <dt>Sellado</dt><dd id="c-date"></dd>
    <dt>Bloque anterior</dt><dd id="c-prev"></dd>
    <dt>Hash</dt><dd id="c-hash"></dd>
    <dt>Fórmula</dt><dd>SHA-256(prev + "|" + contenido + "|" + fecha)</dd>
    <dt>Estado</dt><dd id="c-state"></dd>
  </dl>
  <form method="dialog"><button>Cerrar</button></form>
</dialog>

<script>
// Deriva la URL del back del dominio actual: en produccion el front vive en
// `dominio.com` y el back en `api.dominio.com`. Cambiala a mano si tu setup
// no sigue esa convencion.
const API_BASE = ["localhost", "127.0.0.1"].includes(location.hostname)
  ? "http://localhost:8080"
  : `https://api.${location.hostname.replace(/^www\./, "")}`;

const $list = document.getElementById("list");
const $msg = document.getElementById("msg");
const $form = document.getElementById("form");
const $name = document.getElementById("name");
const $verify = document.getElementById("verify");
const $verifyText = document.getElementById("verify-text");
const $contract = document.getElementById("contract");

// Último resultado de /chain/verify: el contrato de cada bloque lo usa para
// decir si está sano o si la cadena se rompió en él o antes.
let ultimaVerificacion = null;

const abrirContrato = (item) => {
  const rota = ultimaVerificacion && !ultimaVerificacion.valid;
  const sospechoso = rota && item.id >= ultimaVerificacion.brokenAt;

  document.getElementById("c-title").textContent = `Bloque #${item.id}`;
  document.getElementById("c-name").textContent = item.name;
  document.getElementById("c-date").textContent = item.createdAt;
  document.getElementById("c-prev").textContent = item.prevHash;
  document.getElementById("c-hash").textContent = item.hash;

  const $state = document.getElementById("c-state");
  $state.className = sospechoso || !ultimaVerificacion ? "bad" : "ok";
  $state.textContent = !ultimaVerificacion
    ? "sin verificar"
    : sospechoso
      ? `cadena rota desde el bloque #${ultimaVerificacion.brokenAt}`
      : "verificado — el hash cuadra con su contenido";

  $contract.showModal();
};
document.getElementById("api-url").textContent = API_BASE;

const show = (text, isError = false) => {
  $msg.textContent = text;
  $msg.hidden = !text;
  $msg.classList.toggle("error", isError);
};

const render = (items) => {
  $list.replaceChildren(...items.map((item) => {
    const li = document.createElement("li");
    const name = document.createElement("span");
    name.textContent = item.name;             // textContent, no innerHTML: sin XSS
    const when = document.createElement("time");
    when.dateTime = item.createdAt;
    when.textContent = new Date(item.createdAt).toLocaleString();
    li.append(name, when);
    if (item.hash) {
      const block = document.createElement("button");
      block.type = "button";
      block.className = "block";
      block.title = "Ver el contrato de este bloque";
      block.innerHTML = '<svg><use href="#i-block"/></svg>';   // markup fijo, no viene del server
      const hash = document.createElement("span");
      hash.textContent = `#${item.hash.slice(0, 12)}… ← ${item.prevHash.slice(0, 8)}…`;
      block.append(hash);
      block.addEventListener("click", () => abrirContrato(item));
      li.append(block);
    }
    return li;
  }));
};

// Recalcula la cadena en el back: si alguien editó una fila por fuera de la API
// (psql, otro servicio), los hashes dejan de encadenar y esto lo dice.
async function verificar() {
  $verify.className = "badge check";
  $verifyText.textContent = "Verificando…";
  try {
    const res = await fetch(`${API_BASE}/chain/verify`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    ultimaVerificacion = await res.json();
    const { valid, blocks, brokenAt } = ultimaVerificacion;
    $verify.className = `badge ${valid ? "ok" : "bad"}`;
    $verifyText.textContent = valid
      ? `Cadena verificada · ${blocks} ${blocks === 1 ? "bloque" : "bloques"}`
      : `Cadena adulterada en el bloque #${brokenAt}`;
  } catch (err) {
    ultimaVerificacion = null;
    $verify.className = "badge bad";
    $verifyText.textContent = `No se pudo verificar (${err.message})`;
  }
}

$verify.addEventListener("click", verificar);

async function load() {
  try {
    const res = await fetch(`${API_BASE}/items`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const items = await res.json();
    render(items);
    show(items.length ? "" : "Todavía no hay items. Agregá el primero.");
    await verificar();
  } catch (err) {
    // Un fallo de CORS llega como TypeError sin detalle: la causa mas comun es
    // que este origen no este en CORS_ORIGINS del .env del back.
    show(`No se pudo leer la API (${err.message}). Revisá que esté arriba y que este origen esté en CORS_ORIGINS.`, true);
  }
}

$form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const name = $name.value.trim();
  if (!name) return;

  const button = $form.querySelector("button");
  button.disabled = true;
  try {
    const res = await fetch(`${API_BASE}/items`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    $name.value = "";
    await load();
  } catch (err) {
    show(`No se pudo guardar (${err.message}).`, true);
  } finally {
    button.disabled = false;
    $name.focus();
  }
});

load();
</script>
</body>
</html>
