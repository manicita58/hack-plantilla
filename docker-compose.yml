# Solo para desarrollo local: levanta la base y nada más.
# La app la corrés desde el IDE o con `./mvnw spring-boot:run` en apps/api.
#
#   make dev      (o: docker compose up -d --wait && cd apps/api && mvn spring-boot:run)
services:
  db:
    # Imagen propia: Postgres 18 + PostGIS (módulo geo) + pgvector (módulo ia).
    # No existe oficial con las dos. `image:` le pone nombre al build para que
    # docker no la reconstruya en cada `up`.
    build: ./docker/postgres
    image: hack-postgres:18
    environment:
      POSTGRES_USER: hack
      POSTGRES_PASSWORD: hack
      POSTGRES_DB: hack
    ports:
      - "5432:5432"      # expuesto a propósito: es local, no producción
    # Sin esto `docker compose up --wait` devuelve apenas arranca el contenedor,
    # la app le pega antes de tiempo y Flyway muere con "connection refused".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hack -d hack"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata-dev:/var/lib/postgresql   # Postgres 18: NO es .../data (ver docker-compose.prod.yml)

volumes:
  pgdata-dev:
